server.port=8083
spring.application.name=transaction-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/transaction_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wallet}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wallet}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9000/eureka/}
